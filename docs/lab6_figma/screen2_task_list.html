<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskTracker — Мои задачи</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', 'Roboto', 'Segoe UI', sans-serif; background: #f3f4f6; color: #111827; }
  .navbar { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
  .navbar h1 { font-size: 18px; font-weight: 600; }
  .btn-add { background: #3b82f6; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .btn-add:hover { background: #2563eb; }
  .filters { display: flex; gap: 8px; padding: 12px 16px; background: #fff; border-bottom: 1px solid #e5e7eb; }
  .filter-btn { padding: 6px 12px; border: 1px solid #d1d5db; background: #fff; border-radius: 20px; font-size: 14px; cursor: pointer; color: #374151; }
  .filter-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
  .content { padding: 16px; }
  .empty { text-align: center; padding: 60px 20px; color: #6b7280; }
  .empty svg { width: 80px; height: 80px; opacity: 0.4; margin-bottom: 16px; }
  .tasks { display: flex; flex-direction: column; gap: 12px; }
  .task-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; display: flex; align-items: center; gap: 12px; }
  .task-card.done .title { text-decoration: line-through; color: #9ca3af; }
  .checkbox { width: 20px; height: 20px; border: 2px solid #d1d5db; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .checkbox.checked { background: #10b981; border-color: #10b981; }
  .checkbox.checked::after { content: '✓'; color: #fff; font-size: 14px; }
  .info { flex: 1; }
  .title { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
  .date { font-size: 12px; color: #6b7280; }
  .actions { display: flex; gap: 8px; }
  .btn-icon { width: 32px; height: 32px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
  .btn-edit { background: #eff6ff; color: #3b82f6; }
  .btn-delete { background: #fef2f2; color: #ef4444; }
  .btn-edit:hover { background: #dbeafe; }
  .btn-delete:hover { background: #fee2e2; }
  .fab { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; background: #3b82f6; color: #fff; border: none; border-radius: 50%; font-size: 24px; cursor: pointer; box-shadow: 0 4px 6px rgba(59,130,246,0.3); }
  .fab:hover { background: #2563eb; }
</style>
</head>
<body>
  <nav class="navbar">
    <h1>Мои задачи</h1>
    <button class="btn-add">+ Добавить задачу</button>
  </nav>
  <div class="filters">
    <button class="filter-btn active">Все</button>
    <button class="filter-btn">Активные</button>
    <button class="filter-btn">Выполненные</button>
  </div>
  <div class="content">
    <div class="tasks">
      <!-- Пример задачи -->
      <div class="task-card">
        <div class="checkbox"></div>
        <div class="info">
          <div class="title">Купить продукты</div>
          <div class="date">Создано: 20.11.2026</div>
        </div>
        <div class="actions">
          <button class="btn-icon btn-edit">✏</button>
          <button class="btn-icon btn-delete">🗑</button>
        </div>
      </div>
      <div class="task-card done">
        <div class="checkbox checked"></div>
        <div class="info">
          <div class="title">Позвонить маме</div>
          <div class="date">Создано: 19.11.2026</div>
        </div>
        <div class="actions">
          <button class="btn-icon btn-edit">✏</button>
          <button class="btn-icon btn-delete">🗑</button>
        </div>
      </div>
    </div>
  </div>
  <button class="fab">+</button>
</body>
</html>
