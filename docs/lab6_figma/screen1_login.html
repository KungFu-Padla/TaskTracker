<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskTracker — Вход / Регистрация</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', 'Roboto', 'Segoe UI', sans-serif; background: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #111827; }
  .card { background: #ffffff; padding: 32px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
  h2 { font-size: 24px; margin-bottom: 24px; text-align: center; }
  .tab { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab button { flex: 1; padding: 8px 12px; border: 1px solid #d1d5db; background: #f9fafb; border-radius: 8px; cursor: pointer; font-size: 14px; color: #4b5563; }
  .tab button.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
  .form-group { margin-bottom: 16px; }
  label { display: block; margin-bottom: 6px; font-size: 14px; color: #374151; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
  input:focus { outline: none; border-color: #3b82f6; }
  .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px; }
  .btn-primary { background: #3b82f6; color: #fff; }
  .btn-primary:hover { background: #2563eb; }
  .btn-secondary { background: #f3f4f6; color: #111827; margin-top: 12px; }
  .btn-secondary:hover { background: #e5e7eb; }
  .link { text-align: center; margin-top: 16px; font-size: 14px; color: #4b5563; }
  .link a { color: #3b82f6; text-decoration: none; }
  .link a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <h2>Войти / Создать аккаунт</h2>
    <div class="tab">
      <button class="active" id="tab-login">Войти</button>
      <button id="tab-register">Создать аккаунт</button>
    </div>
    <form id="auth-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="email@example.com" required>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" placeholder="••••••••" required>
      </div>
      <div class="form-group" id="confirm-group" style="display:none;">
        <label>Повторите пароль</label>
        <input type="password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" id="btn-submit">Войти</button>
      <button type="button" class="btn btn-secondary" id="btn-switch">Создать аккаунт</button>
    </form>
    <div class="link">
      Забыли пароль? <a href="#">Восстановить</a>
    </div>
  </div>
  <script>
    let isLogin = true;
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const confirmGroup = document.getElementById('confirm-group');
    const btnSubmit = document.getElementById('btn-submit');
    const btnSwitch = document.getElementById('btn-switch');

    function switchTab(login) {
      isLogin = login;
      tabLogin.classList.toggle('active', login);
      tabRegister.classList.toggle('active', !login);
      confirmGroup.style.display = login ? 'none' : 'block';
      btnSubmit.textContent = login ? 'Войти' : 'Создать аккаунт';
      btnSwitch.textContent = login ? 'Создать аккаунт' : 'Уже есть аккаунт? Войти';
    }
    tabLogin.addEventListener('click', () => switchTab(true));
    tabRegister.addEventListener('click', () => switchTab(false));
    btnSwitch.addEventListener('click', () => switchTab(!isLogin));

    document.getElementById('auth-form').addEventListener('submit', (e) => {
      e.preventDefault();
      // Прототип: авторизация не проверяется, сразу переходим к списку задач
      window.location.href = '/list';
    });
  </script>
</body>
</html>
