<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskTracker — Вход / Регистрация</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', 'Roboto', 'Segoe UI', sans-serif; background: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #111827; }
  .card { background: #ffffff; padding: 32px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
  h2 { font-size: 24px; margin-bottom: 24px; text-align: center; }
  .tab { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab button { flex: 1; padding: 8px 12px; border: 1px solid #d1d5db; background: #f9fafb; border-radius: 8px; cursor: pointer; font-size: 14px; color: #4b5563; }
  .tab button.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
  .form-group { margin-bottom: 16px; }
  label { display: block; margin-bottom: 6px; font-size: 14px; color: #374151; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
  input:focus { outline: none; border-color: #3b82f6; ring: 2px solid rgba(59,130,246,0.5); }
  .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px; }
  .btn-primary { background: #3b82f6; color: #fff; }
  .btn-primary:hover { background: #2563eb; }
  .btn-secondary { background: #f3f4f6; color: #111827; margin-top: 12px; }
  .btn-secondary:hover { background: #e5e7eb; }
  .link { text-align: center; margin-top: 16px; font-size: 14px; color: #4b5563; }
  .link a { color: #3b82f6; text-decoration: none; }
  .link a:hover { text-decoration: underline; }
  .hint { font-size: 12px; color: #6b7280; margin-top: 4px; }
</style>
</head>
<body>
  <div class="card">
    <h2>Войти / Создать аккаунт</h2>
    <div class="tab">
      <button class="active">Войти</button>
      <button>Создать аккаунт</button>
    </div>
    <form>
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="email@example.com" required>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" placeholder="••••••••" required>
      </div>
      <div class="form-group" style="display:none;">
        <label>Повторите пароль</label>
        <input type="password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary">Войти</button>
      <button type="button" class="btn btn-secondary">Создать аккаунт</button>
    </form>
    <div class="link">
      Забыли пароль? <a href="#">Восстановить</a>
    </div>
  </div>
</body>
</html>
