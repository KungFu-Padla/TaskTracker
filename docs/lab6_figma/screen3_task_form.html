<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskTracker — Создание задачи</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', 'Roboto', 'Segoe UI', sans-serif; background: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #111827; }
  .card { background: #ffffff; padding: 32px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; max-width: 500px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  h2 { font-size: 20px; font-weight: 600; }
  .btn-back { background: none; border: none; font-size: 18px; cursor: pointer; color: #6b7280; text-decoration: none; }
  .btn-back:hover { color: #111827; }
  .form-group { margin-bottom: 16px; }
  label { display: block; margin-bottom: 6px; font-size: 14px; color: #374151; }
  label span.req { color: #ef4444; }
  input, textarea { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; }
  input:focus, textarea:focus { outline: none; border-color: #3b82f6; }
  textarea { resize: vertical; min-height: 90px; }
  .hint { font-size: 12px; color: #6b7280; margin-top: 4px; }
  .actions { display: flex; gap: 12px; margin-top: 24px; }
  .btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; text-align: center; }
  .btn-cancel { background: #f3f4f6; color: #111827; }
  .btn-cancel:hover { background: #e5e7eb; }
  .btn-save { background: #3b82f6; color: #fff; }
  .btn-save:hover { background: #2563eb; }
</style>
</head>
<body>
  <div class="card">
    <header>
      <h2 id="form-title">Новая задача</h2>
      <a href="/list" class="btn-back">← Назад</a>
    </header>
    <form id="task-form">
      <div class="form-group">
        <label>Название задачи <span class="req">*</span></label>
        <input type="text" id="task-title" placeholder="Например: Купить хлеб" required>
      </div>
      <div class="form-group">
        <label>Описание</label>
        <textarea id="task-desc" placeholder="Дополнительные подробности..."></textarea>
        <div class="hint">Необязательное поле</div>
      </div>
    </form>
    <div class="actions">
      <a href="/list" class="btn btn-cancel">Отмена</a>
      <button type="submit" form="task-form" class="btn btn-save">Сохранить</button>
    </div>
  </div>
  <script>
    document.getElementById('task-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('task-title').value.trim();
      if (!title) return;
      await fetch('/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
      });
      window.location.href = '/list';
    });
  </script>
</body>
</html>
