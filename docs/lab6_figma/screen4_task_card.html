<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskTracker — Карточка задачи</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', 'Roboto', 'Segoe UI', sans-serif; background: #f3f4f6; color: #111827; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
  .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
  .modal-header { padding: 20px 24px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
  .modal-header h2 { font-size: 18px; font-weight: 600; }
  .btn-close { background: none; border: none; font-size: 20px; cursor: pointer; color: #6b7280; line-height: 1; }
  .modal-body { padding: 20px 24px; }
  .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; margin-bottom: 16px; }
  .status-badge.active { background: #dcfce7; color: #15803d; }
  .status-badge.done { background: #dcfce7; color: #166534; }
  .title { font-size: 22px; font-weight: 700; margin-bottom: 8px; word-break: break-word; }
  .description { font-size: 15px; color: #374151; margin-bottom: 20px; white-space: pre-wrap; }
  .meta { display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px; color: #6b7280; font-size: 13px; }
  .actions { display: flex; gap: 10px; padding: 16px 24px; border-top: 1px solid #e5e7eb; }
  .btn { flex: 1; padding: 10px 14px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-done { background: #10b981; color: #fff; }
  .btn-done:hover { background: #059669; }
  .btn-edit { background: #eff6ff; color: #3b82f6; }
  .btn-edit:hover { background: #dbeafe; }
  .btn-delete { background: #fef2f2; color: #ef4444; }
  .btn-delete:hover { background: #fee2e2; }
  .btn-close-modal { background: #f3f4f6; color: #111827; }
  .btn-close-modal:hover { background: #e5e7eb; }
</style>
</head>
<body>
  <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <div class="modal-header">
        <h2>Карточка задачи</h2>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="status-badge active">Активна</div>
        <div class="title">Купить продукты</div>
        <div class="description">Нужно зайти в супермаркет и купить хлеб, молоко и яйца к ужину.</div>
        <div class="meta">
          <div>Создано: 20.11.2026, 14:30</div>
          <div>Обновлено: 20.11.2026, 14:30</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-done">Завершить</button>
        <button class="btn btn-edit">Редактировать</button>
        <button class="btn btn-delete">Удалить</button>
        <button class="btn btn-close-modal" onclick="closeModal()">Закрыть</button>
      </div>
    </div>
  </div>
  <script>
    function closeModal(){ document.querySelector('.modal-backdrop').style.display='none'; }
  </script>
</body>
</html>
