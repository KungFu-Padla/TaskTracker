<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskTracker — Карточка задачи</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', 'Roboto', 'Segoe UI', sans-serif; background: #f3f4f6; color: #111827; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding-top: 60px; }
  .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 460px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); overflow: hidden; }
  .modal-header { padding: 20px 24px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
  .modal-header h2 { font-size: 18px; font-weight: 600; }
  .btn-close { background: none; border: none; font-size: 20px; cursor: pointer; color: #6b7280; text-decoration: none; line-height: 1; }
  .btn-close:hover { color: #111827; }
  .modal-body { padding: 20px 24px; }
  .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; margin-bottom: 16px; }
  .status-badge.active { background: #fef3c7; color: #92400e; }
  .status-badge.done { background: #dcfce7; color: #166534; }
  .title { font-size: 22px; font-weight: 700; margin-bottom: 8px; word-break: break-word; }
  .description { font-size: 15px; color: #374151; margin-bottom: 20px; white-space: pre-wrap; }
  .meta { display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px; color: #6b7280; font-size: 13px; }
  .actions { display: flex; gap: 10px; padding: 16px 24px; border-top: 1px solid #e5e7eb; flex-wrap: wrap; }
  .btn { padding: 10px 14px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; text-align: center; flex: 1; min-width: 90px; }
  .btn-done { background: #10b981; color: #fff; }
  .btn-done:hover { background: #059669; }
  .btn-edit { background: #eff6ff; color: #3b82f6; }
  .btn-edit:hover { background: #dbeafe; }
  .btn-delete { background: #fef2f2; color: #ef4444; }
  .btn-delete:hover { background: #fee2e2; }
  .btn-back { background: #f3f4f6; color: #111827; }
  .btn-back:hover { background: #e5e7eb; }
  .loading { text-align: center; padding: 40px; color: #6b7280; }
</style>
</head>
<body>
  <div class="modal">
    <div class="modal-header">
      <h2>Карточка задачи</h2>
      <a href="/list" class="btn-close">✕</a>
    </div>
    <div class="modal-body" id="card-body">
      <div class="loading">Загрузка...</div>
    </div>
    <div class="actions" id="card-actions" style="display:none;">
      <button class="btn btn-done" id="btn-done">✓ Завершить</button>
      <a class="btn btn-edit" id="btn-edit">✏ Редактировать</a>
      <button class="btn btn-delete" id="btn-delete">🗑 Удалить</button>
      <a href="/list" class="btn btn-back">← К списку</a>
    </div>
  </div>
  <script>
    const taskId = window.location.pathname.split('/').pop();

    async function loadTask() {
      const resp = await fetch('/tasks');
      const tasks = await resp.json();
      const task = tasks.find(t => t.id == taskId);
      if (!task) {
        document.getElementById('card-body').innerHTML = '<div class="loading">Задача не найдена</div>';
        return;
      }
      document.getElementById('card-body').innerHTML = `
        <div class="status-badge ${task.done ? 'done' : 'active'}">${task.done ? 'Выполнена' : 'Активна'}</div>
        <div class="title">${task.title}</div>
        <div class="description">Описание не указано.</div>
        <div class="meta">
          <div>ID задачи: ${task.id}</div>
          <div>Статус: ${task.done ? 'Выполнена' : 'Активна'}</div>
        </div>
      `;
      document.getElementById('card-actions').style.display = 'flex';
      document.getElementById('btn-edit').href = '/new?edit=' + task.id;

      if (task.done) {
        document.getElementById('btn-done').style.display = 'none';
      }
      document.getElementById('btn-done').onclick = async () => {
        await fetch(`/tasks/${task.id}/complete`, { method: 'POST' });
        loadTask();
      };
      document.getElementById('btn-delete').onclick = async () => {
        if (confirm('Удалить задачу?')) {
          await fetch(`/tasks/${task.id}`, { method: 'DELETE' });
          window.location.href = '/list';
        }
      };
    }
    loadTask();
  </script>
</body>
</html>
